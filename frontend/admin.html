<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OS Design | الإدارة</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header><div class="wrap nav"><a class="brand" href="index.html">OS<span>Design</span></a><a href="index.html">← العودة للمتجر</a></div></header><main class="section admin"><div class="wrap"><div id="login" class="panel login"><div class="head"><small>ADMIN</small><h2>لوحة الإدارة</h2></div><input id="user" value="admin" placeholder="اسم المستخدم"><input id="pass" type="password" placeholder="كلمة المرور"><button id="loginBtn" class="btn primary">دخول</button><p class="hint">البيانات الافتراضية: admin / change-me-123 — غيّرها في ملف .env</p></div><div id="dashboard" hidden><div class="adminTop"><div><small>لوحة التحكم</small><h1>إدارة OS Design</h1></div><button id="logout" class="btn">تسجيل الخروج</button></div><div class="stats" id="stats"></div><div class="adminGrid"><section class="panel"><h2>إضافة منتج</h2><form id="productForm"><input name="title" required placeholder="اسم المنتج"><input name="titleEn" placeholder="English title"><select name="category"><option value="logo">شعار</option><option value="identity">هوية</option><option value="social">سوشيال</option><option value="uiux">UI/UX</option><option value="poster">بوستر</option><option value="print">مطبوعات</option></select><input name="price" type="number" min="0" step="0.01" placeholder="السعر بالدولار"><input name="image" placeholder="مسار الصورة، مثال images/logo-01.svg"><textarea name="description" placeholder="الوصف"></textarea><label><input name="featured" type="checkbox"> مميز</label><button class="btn primary">إضافة</button></form></section><section class="panel"><h2>رفع صورة</h2><form id="uploadForm"><input id="imageFile" type="file" accept="image/*" required><button class="btn primary">رفع</button></form><p id="uploadResult" class="hint"></p></section></div><section class="panel"><h2>المنتجات</h2><div id="adminProducts"></div></section><section class="panel"><h2>الطلبات</h2><div id="orders"></div></section><section class="panel"><h2>الرسائل</h2><div id="messages"></div></section></div></div></main><div id="toast"></div><script src="assets/js/admin.js"></script></body></html>
